<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">

  <title>R知 · 中文 R 函数与任务导航</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f6b5b'/%3E%3Ctext x='12' y='43' fill='white' font-family='Arial' font-size='31' font-weight='700'%3ER%3C/text%3E%3C/svg%3E">
  <style>
:root {
  color-scheme: light;
  --bg: #f6f4ee;
  --bg-strong: #ede9df;
  --surface: #fffdf9;
  --surface-subtle: #f9f7f1;
  --surface-strong: #f0ede4;
  --text: #21322d;
  --text-soft: #52645e;
  --muted: #72827c;
  --border: #dde3dd;
  --border-strong: #cbd5ce;
  --brand: #2f6b5b;
  --brand-strong: #235246;
  --brand-soft: #dcebe5;
  --brand-pale: #edf5f1;
  --accent: #d97b59;
  --accent-soft: #f7e1d7;
  --blue: #58789f;
  --blue-soft: #e2eaf4;
  --gold: #9c712a;
  --gold-soft: #f3e9d2;
  --danger: #a74c42;
  --danger-soft: #f5dfdc;
  --shadow-sm: 0 5px 18px rgba(40, 60, 52, 0.06);
  --shadow-md: 0 16px 50px rgba(40, 60, 52, 0.1);
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 26px;
  --sidebar: 248px;
  --topbar: 72px;
  --content-max: 1180px;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #18211f;
  --bg-strong: #202b28;
  --surface: #222d2a;
  --surface-subtle: #1d2825;
  --surface-strong: #2a3733;
  --text: #edf3ef;
  --text-soft: #bdcbc5;
  --muted: #95a69f;
  --border: #34433e;
  --border-strong: #45574f;
  --brand: #7cb9a5;
  --brand-strong: #9cd0bf;
  --brand-soft: #2c4940;
  --brand-pale: #263d36;
  --accent: #ef9d78;
  --accent-soft: #4b332b;
  --blue: #91b3d7;
  --blue-soft: #293d50;
  --gold: #e1bd78;
  --gold-soft: #433823;
  --danger: #f0a099;
  --danger-soft: #4b2d2b;
  --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.18);
  --shadow-md: 0 18px 55px rgba(0, 0, 0, 0.28);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(circle at 88% 2%, color-mix(in srgb, var(--brand-soft) 55%, transparent), transparent 28rem),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

body.nav-open {
  overflow: hidden;
}

button,
input,
textarea,
select {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

img,
svg {
  display: block;
}

::selection {
  background: var(--brand-soft);
  color: var(--text);
}

:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--brand) 62%, transparent);
  outline-offset: 3px;
}

.svg-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.icon {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: 0 0 auto;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 1000;
  padding: 9px 14px;
  border-radius: var(--radius-xs);
  background: var(--brand-strong);
  color: white;
  transform: translateY(-140%);
}

.skip-link:focus {
  transform: translateY(0);
}

.app-shell {
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  width: var(--sidebar);
  display: flex;
  flex-direction: column;
  padding: 24px 16px 18px;
  border-right: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 8px 22px;
}

.brand-mark {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  position: relative;
  border-radius: 13px;
  background: var(--brand-strong);
  color: #fff;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 25px;
  font-weight: 700;
  box-shadow: inset -8px -8px 16px rgba(0, 0, 0, 0.08);
}

.brand-mark span {
  position: absolute;
  right: 6px;
  bottom: 5px;
  font-family: var(--font);
  font-size: 8px;
  letter-spacing: 0.10em;
  opacity: 0.8;
}

.brand-copy {
  display: grid;
  line-height: 1.22;
}

.brand-copy strong {
  font-size: 18px;
  letter-spacing: 0.06em;
}

.brand-copy small {
  margin-top: 4px;
  color: var(--muted);
  font-size: 10.5px;
}

.side-nav {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
}

.nav-label {
  margin: 17px 12px 5px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.12em;
}

.nav-label:first-child {
  margin-top: 0;
}

.nav-item {
  min-height: 42px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 11px;
  border-radius: 11px;
  color: var(--text-soft);
  font-size: 13.5px;
  transition: background 160ms ease, color 160ms ease, transform 160ms ease;
}

.nav-item:hover {
  background: var(--surface-subtle);
  color: var(--text);
}

.nav-item.active {
  background: var(--brand-pale);
  color: var(--brand-strong);
  font-weight: 650;
}

.nav-count {
  min-width: 22px;
  margin-left: auto;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg-strong);
  color: var(--muted);
  font-size: 10px;
  text-align: center;
}

.nav-item.active .nav-count {
  background: color-mix(in srgb, var(--brand-soft) 75%, transparent);
  color: var(--brand-strong);
}

.new-dot {
  width: 7px;
  height: 7px;
  margin-left: auto;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.sidebar-tip {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: auto;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-subtle);
}

.sidebar-tip p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
}

.sidebar-tip strong {
  color: var(--text-soft);
  font-size: 11.5px;
}

.tip-icon {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 8px;
  background: var(--brand-soft);
  color: var(--brand-strong);
  font-size: 13px;
}

kbd {
  display: inline-flex;
  min-width: 23px;
  min-height: 21px;
  align-items: center;
  justify-content: center;
  padding: 1px 5px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--font);
  font-size: 10px;
  line-height: 1;
}

.main-shell {
  min-height: 100vh;
  margin-left: var(--sidebar);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  height: var(--topbar);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 clamp(22px, 4vw, 48px);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(18px);
}

.breadcrumb {
  min-width: 0;
  color: var(--text-soft);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-left: auto;
}

.search-trigger {
  width: clamp(230px, 28vw, 380px);
  height: 42px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 11px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  text-align: left;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
}

.search-trigger:hover {
  border-color: var(--border-strong);
}

.search-trigger span {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12.5px;
}

.search-trigger kbd {
  flex: 0 0 auto;
}

.icon-button {
  position: relative;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text-soft);
  cursor: pointer;
}

.icon-button:hover {
  color: var(--text);
  border-color: var(--border-strong);
}

.menu-button {
  display: none;
}

.theme-icon-sun {
  display: none;
}

html[data-theme="dark"] .theme-icon-moon {
  display: none;
}

html[data-theme="dark"] .theme-icon-sun {
  display: block;
}

.favorite-dot {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 18px;
  height: 18px;
  display: none;
  place-items: center;
  padding: 0 4px;
  border: 2px solid var(--bg);
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
}

.favorite-dot.has-items {
  display: grid;
}

#app {
  min-height: calc(100vh - var(--topbar) - 80px);
  padding: 34px clamp(22px, 4vw, 48px) 56px;
}

.page {
  max-width: var(--content-max);
  margin: 0 auto;
  animation: page-in 300ms ease both;
}

@keyframes page-in {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
}

.page-header {
  margin-bottom: 28px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 10px;
  color: var(--brand);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.11em;
}

.eyebrow::before {
  content: "";
  width: 18px;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
}

.page-title {
  margin: 0;
  color: var(--text);
  font-size: clamp(28px, 4vw, 43px);
  line-height: 1.18;
  letter-spacing: -0.035em;
}

.page-subtitle {
  max-width: 760px;
  margin: 11px 0 0;
  color: var(--text-soft);
  font-size: 15px;
  line-height: 1.8;
}

.section-block {
  margin-top: 42px;
}

.section-title-row {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 16px;
}

.section-title {
  margin: 0;
  font-size: 21px;
  line-height: 1.35;
  letter-spacing: -0.015em;
}

.section-copy {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 12.5px;
}

.text-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--brand);
  font-size: 12.5px;
  font-weight: 650;
}

.text-link .icon {
  width: 15px;
  height: 15px;
  transition: transform 150ms ease;
}

.text-link:hover .icon {
  transform: translateX(3px);
}

.button {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 15px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--surface);
  color: var(--text-soft);
  font-size: 12.5px;
  font-weight: 650;
  cursor: pointer;
  transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
}

.button:hover {
  transform: translateY(-1px);
  border-color: var(--border-strong);
}

.button-primary {
  border-color: var(--brand-strong);
  background: var(--brand-strong);
  color: #fff;
}

.button-primary:hover {
  background: color-mix(in srgb, var(--brand-strong) 90%, black);
}

.button-ghost {
  border-color: transparent;
  background: transparent;
}

.button-danger {
  border-color: color-mix(in srgb, var(--danger) 25%, var(--border));
  color: var(--danger);
  background: var(--danger-soft);
}

.button .icon {
  width: 16px;
  height: 16px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 24px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-strong);
  color: var(--text-soft);
  font-size: 10.5px;
  font-weight: 650;
  white-space: nowrap;
}

.badge-brand {
  background: var(--brand-pale);
  color: var(--brand-strong);
}

.badge-accent {
  background: var(--accent-soft);
  color: var(--accent);
}

.badge-blue {
  background: var(--blue-soft);
  color: var(--blue);
}

.badge-gold {
  background: var(--gold-soft);
  color: var(--gold);
}

.panel {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.home-hero {
  min-height: 390px;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
  align-items: center;
  gap: clamp(34px, 6vw, 82px);
  padding: clamp(32px, 5vw, 62px);
  border: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
  border-radius: var(--radius-lg);
  background:
    linear-gradient(130deg, color-mix(in srgb, var(--brand-pale) 92%, transparent), color-mix(in srgb, var(--surface) 96%, transparent) 63%),
    var(--surface);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

.hero-title {
  max-width: 680px;
  margin: 8px 0 16px;
  font-size: clamp(35px, 5.2vw, 62px);
  line-height: 1.12;
  letter-spacing: -0.055em;
}

.hero-title em {
  color: var(--brand);
  font-style: normal;
}

.hero-copy {
  max-width: 620px;
  margin: 0;
  color: var(--text-soft);
  font-size: 15px;
  line-height: 1.85;
}

.hero-search {
  max-width: 650px;
  display: flex;
  gap: 8px;
  margin-top: 25px;
}

.hero-search-box {
  min-width: 0;
  min-height: 54px;
  display: flex;
  flex: 1;
  align-items: center;
  gap: 11px;
  padding: 0 15px;
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 8px 24px rgba(37, 63, 54, 0.06);
}

.hero-search-box .icon {
  color: var(--brand);
}

.hero-search-box input {
  min-width: 0;
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 14px;
}

.hero-search-box input::placeholder {
  color: var(--muted);
}

.hero-search .button {
  min-width: 86px;
  min-height: 54px;
  border-radius: 14px;
}

.quick-searches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}

.quick-chip {
  min-height: 32px;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  color: var(--muted);
  font-size: 11.5px;
  cursor: pointer;
}

.quick-chip:hover {
  color: var(--brand);
  border-color: color-mix(in srgb, var(--brand) 35%, var(--border));
}

.hero-visual {
  position: relative;
  min-height: 290px;
}

.code-paper {
  position: absolute;
  inset: 18px 0 6px 22px;
  padding: 22px;
  transform: rotate(1.4deg);
  border: 1px solid color-mix(in srgb, var(--border-strong) 70%, transparent);
  border-radius: 18px;
  background: #1d2b27;
  color: #dbe6e1;
  box-shadow: 20px 24px 55px rgba(25, 49, 41, 0.2);
}

.code-paper::before {
  content: "";
  position: absolute;
  inset: 11px -11px -11px 11px;
  z-index: -1;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--accent-soft);
}

.window-dots {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}

.window-dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #5e716a;
}

.window-dots span:first-child {
  background: #e99172;
}

.window-dots span:nth-child(2) {
  background: #e5c26d;
}

.window-dots span:nth-child(3) {
  background: #78b89d;
}

.code-paper pre {
  margin: 0;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.9;
  white-space: pre-wrap;
}

.code-paper .c-comment {
  color: #7f958d;
}

.code-paper .c-fn {
  color: #f2b493;
}

.code-paper .c-var {
  color: #a8d5c6;
}

.code-paper .c-string {
  color: #e8cf92;
}

.floating-note {
  position: absolute;
  right: -18px;
  bottom: -12px;
  width: 188px;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
  box-shadow: var(--shadow-md);
  transform: rotate(-2deg);
}

.floating-note strong {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--brand);
  font-size: 11.5px;
}

.floating-note span {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.5;
}

.r-intro-panel {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(330px, 0.85fr);
  gap: clamp(28px, 4vw, 52px);
  padding: clamp(26px, 4vw, 42px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at 100% 0, var(--accent-soft), transparent 280px),
    var(--surface);
  box-shadow: var(--shadow-sm);
}

.r-intro-copy h2 {
  max-width: 650px;
  margin: 0 0 12px;
  font-size: clamp(24px, 3vw, 34px);
  line-height: 1.3;
  letter-spacing: -0.025em;
}

.r-intro-copy p {
  max-width: 660px;
  margin: 0 0 11px;
  color: var(--text-soft);
  font-size: 13.5px;
  line-height: 1.85;
}

.r-intro-copy .button {
  margin-top: 10px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  margin-top: 12px;
}

.hero-actions .button {
  margin-top: 0;
}

.r-use-cases {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  align-content: center;
}

.use-case-item {
  display: flex;
  gap: 10px;
  min-height: 112px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface-subtle) 90%, transparent);
}

.use-case-item > span {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
}

.use-case-item strong {
  display: block;
  font-size: 12px;
}

.use-case-item small {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.6;
}

.language-pipeline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
  padding: 12px 16px;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-subtle);
  color: var(--text-soft);
  font-size: 10.5px;
  white-space: nowrap;
}

.language-pipeline span {
  padding: 4px 8px;
  border-radius: 6px;
  background: var(--surface);
}

.language-pipeline b {
  color: var(--brand);
  font-size: 9px;
  font-weight: 650;
}

.language-pipeline b::after {
  content: " →";
}

.path-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.path-card {
  position: relative;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
}

.path-card:hover {
  transform: translateY(-3px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
}

.path-card::after {
  content: "";
  position: absolute;
  right: -24px;
  top: -24px;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: var(--brand-pale);
}

.path-card.accent::after {
  background: var(--accent-soft);
}

.path-card.blue::after {
  background: var(--blue-soft);
}

.path-icon {
  width: 37px;
  height: 37px;
  display: grid;
  place-items: center;
  position: relative;
  z-index: 1;
  border-radius: 11px;
  background: var(--brand-pale);
  color: var(--brand);
}

.path-card.accent .path-icon {
  background: var(--accent-soft);
  color: var(--accent);
}

.path-card.blue .path-icon {
  background: var(--blue-soft);
  color: var(--blue);
}

.path-card h3 {
  margin: 18px 0 6px;
  font-size: 15px;
}

.path-card p {
  margin: 0 0 14px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.path-card .text-link {
  margin-top: auto;
}

.function-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.function-card {
  min-height: 150px;
  display: flex;
  flex-direction: column;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}

.function-card:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--brand) 28%, var(--border));
  box-shadow: var(--shadow-sm);
}

.function-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.function-name {
  color: var(--text);
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 650;
}

.function-card p {
  margin: 10px 0 14px;
  color: var(--text-soft);
  font-size: 12.5px;
  line-height: 1.65;
}

.function-card-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: auto;
}

.function-meta {
  color: var(--muted);
  font-size: 10.5px;
}

.course-mark {
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--gold-soft);
  color: var(--gold);
  font-size: 9px;
  font-weight: 650;
}

.learning-grid {

}

.learning-path {

}

.progress-head {

}

.progress-head strong {

}

.progress-head span {

}

.progress-track {

}

.progress-track span {
  display: block;

}

.learning-steps {

}

.learning-steps li {

}

.learning-step-link {

.step-number {

}

.learning-steps li.done .step-number {

}

.learning-steps li.current .step-number {

}

.learning-steps strong {
  display: block;

}

.learning-steps small {
  display: block;
  color: var(--muted);

}

.learning-steps .icon {
  width: 15px;

}

.continue-card {
  display: flex;

  padding: 24px;

.continue-label {
  color: var(--accent);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.continue-card h3 {
  margin: 11px 0 6px;
  font-size: 18px;
}

.continue-card p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}

.mini-code {
  margin: 18px 0;

  border-radius: 11px;
  background: #1d2b27;
  color: #dce7e2;

}

.continue-card .button {

.toolbar {

.detail-back {

.code-block {

.param-table th,

.param-table th {

.tab-button {

.inspector-output {

.inspector-note {

.comparison-table {

.symbol-card h3 {

.symbol-card p {

.topic-banner .button {

.inline-code {

.task-contract strong {

  background: var(--surface);

.problem-nav-group > div:first-child {
  margin-bottom: 9px;
}

.problem-nav-group strong {
  display: block;
  font-size: 11.5px;
}

.problem-nav-group small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.45;
}

.problem-nav-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.problem-nav-button {
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-subtle);
  color: var(--text-soft);
  font-size: 10px;
  cursor: pointer;
}

.problem-nav-button:hover {
  border-color: var(--border-strong);
}

.problem-nav-button.active {
  border-color: var(--brand);
  background: var(--brand-soft);
  color: var(--brand-strong);
  font-weight: 650;
}

.problem-nav-button .icon {
  width: 12px;
  height: 12px;
}

.rstudio-shell {
  margin: 20px 0 5px;
  overflow: hidden;
  border: 1px solid #41574f;
  border-radius: 13px;
  background: #17231f;
  box-shadow: 0 16px 32px rgba(20, 35, 29, 0.15);
}

.rstudio-menubar {
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 12px;
  border-bottom: 1px solid #354841;
  background: #24352f;
  color: #bdcbc5;
  font-size: 8.5px;
}

.rstudio-menubar b {
  margin-left: auto;
  color: #d7e3de;
  font-size: 8.5px;
}

.rstudio-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(220px, 0.85fr);
  grid-template-rows: minmax(165px, auto) minmax(130px, auto);
  gap: 4px;
  padding: 4px;
}

.rstudio-pane {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 3px;
  padding: 0;
  overflow: hidden;
  border: 1px solid #354841;
  border-radius: 5px;
  background: #fbfbf8;
  color: #293a34;
  text-align: left;
  cursor: pointer;
}

.rstudio-pane.active {
  border-color: #8dc5b2;
  box-shadow: 0 0 0 2px rgba(112, 180, 156, 0.25);
}

.rstudio-pane.script,
.rstudio-pane.console {
  grid-column: 1;
}

.rstudio-pane.environment,
.rstudio-pane.files {
  grid-column: 2;
}

.pane-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 9px;
  border-bottom: 1px solid #d8dfda;
  background: #eef1ed;
  color: #475a53;
  font-size: 8.5px;
  font-weight: 650;
}

.pane-title small {
  color: #74837e;
  font-size: 7.5px;
}

.rstudio-code {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  min-height: 29px;
  align-items: center;
  color: #35524a;
  font-family: var(--mono);
  font-size: 9.5px;
}

.rstudio-code i {
  color: #9aa8a2;
  font-style: normal;
  text-align: right;
  padding-right: 7px;
}

.rstudio-code code {
  font-family: inherit;
}

.console-line {
  padding: 4px 9px 0;
  color: #35524a;
  font-family: var(--mono);
  font-size: 9px;
}

.console-line b {
  color: #5c86a7;
}

.console-output {
  padding: 2px 9px 8px;
  color: #75837e;
  font-family: var(--mono);
  font-size: 9px;
}

.env-row {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  gap: 8px;
  padding: 8px;
  border-bottom: 1px solid #e3e7e3;
  font-size: 8.5px;
}

.env-row code {
  color: #345c50;
  font-family: var(--mono);
}

.env-row em {
  color: #8a9792;
  font-style: normal;
}

.env-row b {
  overflow: hidden;
  color: #667771;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pane-tabs {
  display: flex;
  gap: 9px;
  padding: 6px 8px;
  border-bottom: 1px solid #d8dfda;
  background: #eef1ed;
  color: #73827c;
  font-size: 7.5px;
}

.pane-tabs b {
  color: #355d51;
}

.help-preview {
  padding: 3px 9px;
  color: #40544d;
  font-size: 8px;
}

.help-preview.muted {
  color: #7d8c86;
}

.rstudio-explanation {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  align-items: baseline;
  gap: 9px;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-subtle);
}

.rstudio-explanation > span {
  color: var(--brand);
  font-size: 9px;
  font-weight: 700;
}

.rstudio-explanation strong {
  font-size: 11.5px;
  white-space: nowrap;
}

.rstudio-explanation p {
  margin: 0;
  color: var(--text-soft);
  font-size: 10.5px;
  line-height: 1.65;
}

.peek-function-pill {
  border: 0;
  cursor: pointer;
}

.peek-function-pill .icon {
  width: 12px;
  height: 12px;
}

.function-peek {
  position: fixed;
  inset: 18px 18px 18px auto;
  width: min(560px, calc(100vw - 36px));
  height: calc(100dvh - 36px);
  max-height: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 28px 100px rgba(20, 35, 29, 0.35);
}

.function-peek::backdrop {
  background: rgba(24, 35, 31, 0.34);
  backdrop-filter: blur(3px);
}

.peek-sheet {
  height: 100%;
  display: flex;
  flex-direction: column;
}

.peek-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--border);
}

.peek-header .eyebrow {
  margin-bottom: 6px;
}

.peek-header h2 {
  margin: 0;
  font-family: var(--mono);
  font-size: 25px;
}

.peek-body {
  min-height: 0;
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px;
}

.peek-summary {
  margin: 0 0 10px;
  color: var(--text-soft);
  font-size: 12px;
  line-height: 1.7;
}

.peek-section {
  margin-top: 18px;
}

.peek-section h3 {
  margin: 0 0 7px;
  font-size: 12px;
}

.peek-section > p {
  margin: 0;
  color: var(--text-soft);
  font-size: 11px;
  line-height: 1.65;
}

.peek-section .code-block {
  margin-top: 0;
  font-size: 10.5px;
}

.peek-params {
  display: grid;
  gap: 6px;
}

.peek-params > div {
  display: grid;
  grid-template-columns: minmax(80px, auto) auto minmax(0, 1fr);
  align-items: start;
  gap: 8px;
  padding: 9px;
  border-radius: 8px;
  background: var(--surface-subtle);
}

.peek-params code {
  color: var(--brand);
  font-family: var(--mono);
  font-size: 10px;
}

.peek-params span {
  color: var(--muted);
  font-size: 9px;
  white-space: nowrap;
}

.peek-params p {
  margin: 0;
  color: var(--text-soft);
  font-size: 10px;
  line-height: 1.5;
}

.peek-footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  padding: 13px 20px max(13px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.reference-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 11px;
}

.reference-card {
  min-height: 185px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}

.reference-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}

.reference-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--brand-pale);
  color: var(--brand);
}

.reference-card small {
  margin-top: 16px;
  color: var(--accent);
  font-size: 9.5px;
  font-weight: 700;
}

.reference-card h2 {
  margin: 3px 0 6px;
  font-size: 16px;
}

.reference-card p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;
}

.reference-card .text-link {
  margin-top: auto;
  padding-top: 14px;
}

.error-list {
  display: grid;
  gap: 8px;
}

.error-card {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

.error-card summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 18px;
  align-items: center;
  gap: 12px;
  min-height: 58px;
  padding: 12px 16px;
  cursor: pointer;
  list-style: none;
}

.error-card summary::-webkit-details-marker {
  display: none;
}

.error-card summary code {
  overflow-wrap: anywhere;
  color: var(--text);
  font-family: var(--mono);
  font-size: 11.5px;
}

.error-card summary > span {
  color: var(--muted);
  font-size: 9.5px;
}

.error-card summary > .icon {
  width: 15px;
  height: 15px;
  color: var(--muted);
  transition: transform 160ms ease;
}

.error-card[open] summary {
  background: var(--surface-subtle);
}

.error-card[open] summary > .icon {
  transform: rotate(180deg);
}

.error-card-body {
  padding: 17px;
  border-top: 1px solid var(--border);
}

.error-card-body > p {
  margin: 0 0 13px;
  color: var(--text-soft);
  font-size: 11.5px;
  line-height: 1.7;
}

.error-card-body h3 {
  margin: 14px 0 6px;
  font-size: 11.5px;
}

.error-card-body ol {
  display: grid;
  gap: 5px;
  margin: 0;
  padding-left: 20px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.65;
}

.error-card-body .code-block {
  margin-top: 0;
}

.site-footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 0 clamp(22px, 4vw, 48px) 24px;
  color: var(--muted);
  font-size: 9.5px;
}

.mobile-scrim,
.mobile-tabbar {
  display: none;
}

.search-dialog {
  width: min(690px, calc(100vw - 28px));
  max-height: min(690px, calc(100vh - 60px));
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 28px 100px rgba(20, 35, 29, 0.35);
}

.search-dialog::backdrop {
  background: rgba(24, 35, 31, 0.48);
  backdrop-filter: blur(5px);
}

.search-dialog-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 17px;
  border-bottom: 1px solid var(--border);
}

.search-dialog-head > .icon {
  color: var(--brand);
}

.search-dialog-head input {
  min-width: 0;
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 15px;
}

.search-type-row {
  display: flex;
  gap: 5px;
  padding: 9px 12px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--surface-subtle);
}

.search-type {
  min-width: max-content;
  min-height: 30px;
  padding: 4px 10px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 10.5px;
  cursor: pointer;
}

.search-type.active {
  border-color: var(--border);
  background: var(--surface);
  color: var(--brand-strong);
  font-weight: 650;
}

.close-button {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: var(--surface-subtle);
  color: var(--muted);
  cursor: pointer;
}

.search-results {
  max-height: 520px;
  overflow-y: auto;
  padding: 8px;
}

.search-section-label {
  padding: 10px 10px 5px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
}

.search-result {
  width: 100%;
  display: grid;
  grid-template-columns: 35px minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
  padding: 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.search-result:hover,
.search-result.selected {
  background: var(--brand-pale);
}

.search-result-icon {
  width: 35px;
  height: 35px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--surface-strong);
  color: var(--brand);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
}

.search-result-copy {
  min-width: 0;
}

.search-result-copy strong {
  display: block;
  overflow: hidden;
  color: var(--text);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-result-copy span {
  display: block;
  overflow: hidden;
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-result-copy code {
  color: var(--brand);
  font-family: var(--mono);
  font-size: 0.94em;
}

.search-result .badge {
  font-size: 9px;
}

.search-footer {
  display: flex;
  gap: 15px;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 9.5px;
}

.search-footer span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 100;
  max-width: min(360px, calc(100vw - 40px));
  padding: 11px 15px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  background: var(--text);
  color: var(--surface);
  font-size: 11.5px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
  transition: opacity 180ms ease, transform 180ms ease;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 1080px) {
  :root {
    --sidebar: 226px;
  }

  .home-hero {
    grid-template-columns: minmax(0, 1fr);
  }

  .goal-home {
    grid-template-columns: minmax(0, 1fr);
  }

  .goal-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .home-quick-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .teaching-card-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .home-progress-card {
    min-width: 0;
  }

  .r-intro-panel {
    grid-template-columns: minmax(0, 1fr);
  }

  .hero-visual {
    display: none;
  }

  .function-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .concept-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 820px) {
  :root {
    --topbar: 64px;
  }

  body {
    padding-bottom: 72px;
  }

  .sidebar {
    width: min(292px, 86vw);
    transform: translateX(-105%);
    transition: transform 220ms ease;
    box-shadow: 20px 0 60px rgba(20, 35, 29, 0.24);
  }

  .nav-open .sidebar {
    transform: translateX(0);
  }

  .mobile-scrim {
    position: fixed;
    inset: 0;
    z-index: 25;
    width: 100%;
    border: 0;
    background: rgba(25, 36, 32, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
  }

  .nav-open .mobile-scrim {
    display: block;
    opacity: 1;
    pointer-events: auto;
  }

  .main-shell {
    margin-left: 0;
  }

  .menu-button {
    display: grid;
  }

  .topbar {
    padding: 0 18px;
  }

  .breadcrumb {
    display: none;
  }

  .search-trigger {
    width: 42px;
    justify-content: center;
  }

  .search-trigger span,
  .search-trigger kbd {
    display: none;
  }

  .saved-shortcut {
    display: none;
  }

  #app {
    padding: 26px 18px 38px;
  }

  .site-footer {
    padding: 0 18px 20px;
  }

  .site-footer span:last-child {
    display: none;
  }

  .mobile-tabbar {
    position: fixed;
    inset: auto 0 0;
    z-index: 35;
    height: 66px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 5px 8px max(5px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(16px);
  }

  .mobile-tabbar a,
  .mobile-tabbar button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 9.5px;
    cursor: pointer;
  }

  .mobile-tabbar a.active {
    color: var(--brand);
  }

  .mobile-tabbar .icon {
    width: 19px;
    height: 19px;
  }

  .home-hero {
    min-height: auto;
    padding: 30px 24px;
  }

  .hero-title {
    font-size: clamp(34px, 9vw, 50px);
  }

  .quick-error-panel {
    grid-template-columns: minmax(0, 1fr);
  }

  .ai-home-entry {
    align-items: flex-start;
    flex-direction: column;
  }

  .path-grid,
  .learning-grid,
  .two-column,
  .detail-grid,
  .workflow-layout,
  .ai-layout,
  .network-demo,
  .learn-dashboard,
  .lesson-layout,
  .control-layout,
  .quick-code-row,
  .r-intro-panel {
    grid-template-columns: minmax(0, 1fr);
  }

  .lesson-rail {
    position: static;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lesson-rail > .eyebrow {
    grid-column: 1 / -1;
  }

  .lesson-footer {
    grid-template-columns: minmax(0, 1fr);
  }

  .lesson-footer .button,
  .lesson-footer > :last-child {
    width: 100%;
    justify-self: stretch;
  }

  .basics-route,
  .cleaning-roadmap {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .reference-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .entry-source-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .entry-source-grid p {
    min-height: 0;
  }

  .task-contract {
    grid-template-columns: minmax(0, 1fr);
  }

  .workflow-contract > div:last-child {
    grid-column: auto;
  }

  .topic-banner {
    align-items: flex-start;
    flex-direction: column;
  }

  .path-grid {
    gap: 10px;
  }

  .path-card {
    min-height: 155px;
  }

  .function-list {
    grid-template-columns: minmax(0, 1fr);
  }

  .detail-aside,
  .workflow-code {
    position: static;
  }

  .symbol-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .score-demo {
    grid-template-columns: minmax(0, 1fr);
  }

  .scale-flow {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .saved-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .toast {
    right: 14px;
    bottom: 80px;
  }
}

@media (max-width: 560px) {
  .function-grid,
  .concept-grid,
  .symbol-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .goal-home {
    padding: 24px;
  }

  .goal-search {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }

  .goal-search .button {
    width: 100%;
  }

  .goal-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .home-quick-grid,
  .teaching-card-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .r-use-cases,
  .basics-route,
  .cleaning-roadmap,
  .course-roadmap,
  .glossary-grid,
  .reference-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .rstudio-map {
    grid-template-columns: minmax(0, 1fr);
  }

  .quick-finish {
    align-items: flex-start;
    flex-direction: column;
  }

  .quick-step-head {
    grid-template-columns: 36px minmax(0, 1fr);
  }

  .quick-step-head > .badge {
    grid-column: 2;
    justify-self: start;
  }

  .function-peek {
    inset: 10px;
    width: auto;
    height: calc(100dvh - 20px);
  }

  .use-case-item {
    min-height: 0;
  }

  .language-pipeline {
    justify-content: flex-start;
  }

  .operator-group-head {
    display: block;
  }

  .operator-group-head p {
    margin-top: 5px;
  }

  .hero-search {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }

  .hero-search .button {
    width: 100%;
  }

  .function-hero {
    display: block;
  }

  .function-hero .button {
    margin-top: 18px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }

  .toolbar-search {
    grid-column: 1 / -1;
  }

  .toolbar select {
    width: 100%;
  }

  .item-row {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 6px;
  }

  .item-row > span {
    grid-column: 1 / -1;
    margin-bottom: 2px;
  }

  .score-choice {
    width: 100%;
    min-height: 44px;
  }

  .search-footer {
    display: none;
  }

  .search-dialog {
    max-height: calc(100vh - 24px);
  }

  .section-title-row {
    align-items: flex-start;
  }

  .page-title {
    font-size: 31px;
  }
}

  .search-trigger,
  .quick-chip,
  .filter-chip,

  .copy-button {

    height: 44px;

  }
}

@media (prefers-reduced-motion: reduce) {

  }
}

function analyzeQuickError(text) {
  const target = document.getElementById("quick-error-result");
  if (!target) return;
  const input = text.trim().toLowerCase();
  if (!input) {
    target.innerHTML = `<span>还没有输入</span><p>请先粘贴一条 R 报错。</p>`;
    return;
  }
  const stopWords = new Set(["error", "the", "not", "for", "with", "and", "has", "can", "was", "are", "this", "that"]);
  const scoreItem = (item) => {
    const phrase = item.error.toLowerCase();
    const words = phrase.match(/[a-z_][a-z0-9_.]{2,}/g) || [];
    let score = input.includes(phrase) ? 100 : 0;
    for (const word of words) {
      if (!stopWords.has(word) && input.includes(word)) score += 7;
    }
    const chinese = item.meaning.match(/[\u4e00-\u9fa5]{2,}/g) || [];
    for (const word of chinese) if (input.includes(word)) score += 4;
    return score;
  };
  const scored = errorCatalog
    .map((item) => ({ item, score: scoreItem(item) }))
    .filter((entry) => entry.score > 0)
    .sort((a, b) => b.score - a.score);
  const bestScore = scored[0]?.score || 0;
  const ranked = scored
    .filter((entry) => entry.score >= Math.max(8, bestScore * 0.35))
    .slice(0, 1);
  if (!ranked.length) {
    target.innerHTML = `
      <span>没有精确匹配</span>
      <p>先检查报错中的对象名、函数名和文件路径。你也可以打开完整报错词典，按“对象、函数、缺失值、文件”等关键词继续查找。</p>
      <button class="button" type="button" data-action="open-error-search" data-query="${escapeHtml(text.trim())}">查看完整报错速查 ${icon("arrow-right")}</button>
    `;
    return;
  }
  target.innerHTML = ranked.map(({ item }, index) => `
    <div class="quick-error-match ${index === 0 ? "primary" : ""}">
      <span>${index === 0 ? "最可能的原因" : "其他可能"}</span>
      <code>${escapeHtml(item.error)}</code>
      <p>${escapeHtml(item.meaning)}</p>
      <ol>${item.checks.slice(0, 3).map((check) => `<li>${escapeHtml(check)}</li>`).join("")}</ol>
      <div class="quick-error-actions">
        ${(item.functions || []).slice(0, 3).map((id) => peekFunctionPill(id)).join("")}
        <button class="button" type="button" data-action="open-error-search" data-query="${escapeHtml(item.error)}">打开完整排查步骤 ${icon("arrow-right")}</button>
      </div>
    </div>
  `).join("");
}

function getFilteredFunctions() {
  const query = state.functionQuery.trim().toLowerCase();
  return functions.filter((item) => {
    const categoryMatch = state.functionCategory === "全部" || item.category === state.functionCategory;
    const packageMatch = state.functionPackage === "全部" || item.package === state.functionPackage;
    const haystack = [
      item.name,
      item.package,
      item.category,
      item.summary,
      item.level,
      ...item.aliases,
      ...item.params.flat(),
    ].join(" ").toLowerCase();
    return categoryMatch && packageMatch && (!query || haystack.includes(query));
  });
}

function renderFunctionResults() {
  const result = getFilteredFunctions();
  const list = document.getElementById("function-results");
  const count = document.getElementById("function-result-count");
  if (!list || !count) return;
  count.textContent = `找到 ${result.length} 个函数`;
  list.innerHTML = result.length
    ? result.map(functionCard).join("")
    : `<div class="empty-state" style="grid-column:1/-1">${icon("search")}<h3>没有找到匹配条目</h3><p>试试更短的关键词，或重置分类与包筛选。</p></div>`;
}

function selectRStudioPanel(panel) {
  state.rstudioPanel = panel;
  const info = rstudioPanelInfo[panel];
  if (!info) return;
  document.querySelectorAll(".rstudio-pane").forEach((pane) => {
    const active = pane.dataset.panel === panel;
    pane.classList.toggle("active", active);

  if (note) note.innerHTML = `<span>你正在看</span><strong>${escapeHtml(info.title)}</strong><p>${escapeHtml(info.text)}</p>`;

function runLoopDemo() {
  const items = [...document.querySelectorAll("[data-loop-item]")];
  const result = document.getElementById("loop-result");
  items.forEach((item) => {
    item.classList.remove("done");
    const status = item.querySelector("span");
    if (status) status.textContent = "等待";
  });
  if (result) result.textContent = "循环开始，每次处理一个文件…";
  items.forEach((item, index) => {
    window.setTimeout(() => {
      item.classList.add("done");
      const status = item.querySelector("span");
      if (status) status.textContent = `已读取 ${120 + index * 18} 行`;
      if (index === items.length - 1 && result) result.textContent = "循环完成：三个文件使用了同一段处理代码。";
    }, 450 * (index + 1));
  });
}

  const route = currentRoute();

  else if (route === "functions") renderFunctionsPage();
  else if (route.startsWith("function/")) renderFunctionDetail(route.split("/")[1]);

  else if (route === "control-flow") renderControlFlow();

function updateScaleScore() {
  const adjusted = state.scaleScores.map((score, index) => scaleItems[index].reverse ? 6 - score : score);
  const total = adjusted.reduce((sum, score) => sum + score, 0);
  const target = document.getElementById("scale-score");
  const explanation = document.getElementById("scale-score-explain");
  if (target) target.textContent = total;
  if (explanation) explanation.textContent = `反向题已按 6 − 原始分转换；本例平均 ${ (total / adjusted.length).toFixed(1) } 分。`;
  document.querySelectorAll(".score-choice").forEach((button) => {
    const item = Number(button.dataset.item);
    const score = Number(button.dataset.score);
    button.classList.toggle("selected", state.scaleScores[item] === score);
  });
}

  }
}

function analyzeCode() {
  const input = document.getElementById("code-input");
  const output = document.getElementById("ai-output");
  if (!input || !output) return;
  const code = input.value.trim();
  if (!code) {
    showToast("请先粘贴一段 R 代码");
    input.focus();
    return;
  }

  const recognized = functions.filter((item) => {
    const base = item.name.replace("()", "");
    return new RegExp(`\\b${base.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\s*\\(`).test(code);
  });
  const packages = [...new Set(recognized.map((item) => item.package))];
  const lines = code.split("\n").filter((line) => line.trim());
  const steps = [];
  if (/\|>|%>%/.test(code)) steps.push(["连接处理步骤", "代码使用管道把前一步结果传给下一步；先按管道分段阅读，每段只回答一个问题。"]);
  if (/\bfilter\s*\(/.test(code)) steps.push(["筛选研究样本", "filter() 在不改变原数据对象的情况下保留满足条件的行；注意缺失值条件。"]);
  if (/\bmutate\s*\(/.test(code)) steps.push(["创建或修改变量", "mutate() 生成新列或覆盖旧列，左侧名称是结果列，右侧是计算规则。"]);
  if (/\bglm\s*\(/.test(code)) steps.push(["拟合广义线性模型", "glm() 只返回模型对象；family = binomial() 通常表示二分类结局的 logistic 回归。"]);
  if (/\bsummary\s*\(/.test(code)) steps.push(["读取结果摘要", "summary() 展示系数、标准误和检验信息，但不能单独证明因果或预测性能。"]);
  if (!steps.length) steps.push(["从函数调用开始阅读", "按“函数名（输入对象，命名参数）”逐层拆解括号，先确认输入对象，再看命名参数。"]);

  output.innerHTML = `
    <div class="ai-output-head">
      <h2>解释结果</h2>
      ${badge(`${lines.length} 行代码`, "blue")}
    </div>
    <div class="explain-steps">
      ${steps.map(([title, text], index) => `
        <div class="explain-step">
          <span>${String(index + 1).padStart(2, "0")}</span>
          <div><strong>${escapeHtml(title)}</strong><p>${escapeHtml(text)}</p></div>
        </div>
      `).join("")}
    </div>
    <div class="detected-packages">
      ${recognized.length ? recognized.map((item) => `<a class="function-pill" href="#function/${item.id}">${escapeHtml(item.name)}</a>`).join("") : badge("未识别到词典内的已知函数")}
    </div>
    <p class="inspector-note">识别到的包：${escapeHtml(packages.join("、") || "未从示例中确定")}。此结果只做静态解释，没有执行代码，也没有检查数据本身。</p>
  `;
}

const allSearchItems = buildSearchItems();

function searchTypeMatches(item) {
  if (state.searchType === "全部") return true;
  if (state.searchType === "函数") return item.type === "函数";
  if (state.searchType === "符号") return item.type === "符号";
  if (state.searchType === "术语") return item.type === "术语";
  if (state.searchType === "报错") return item.type === "报错";
  if (state.searchType === "教程") return ["系统课", "入门", "任务", "问题"].includes(item.type);
  return true;
}

function searchMatches(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    if (state.searchType === "符号") return allSearchItems.filter((item) => item.type === "符号").slice(0, 12);
    if (state.searchType === "报错") return allSearchItems.filter((item) => item.type === "报错").slice(0, 10);
    if (state.searchType === "术语") return allSearchItems.filter((item) => item.type === "术语").slice(0, 10);
    if (state.searchType === "函数") return allSearchItems.filter((item) => item.type === "函数").slice(0, 10);
    if (state.searchType === "教程") return allSearchItems.filter((item) => ["系统课", "入门", "任务", "问题"].includes(item.type)).slice(0, 10);
    return [
      allSearchItems.find((entry) => entry.route === "learn/quick"),
      allSearchItems.find((entry) => entry.route === "learn/r-1"),
      ...functions.filter((item) => item.popular).slice(0, 4).map((item) => allSearchItems.find((entry) => entry.route === `function/${item.id}`)),
      ...workflows.slice(0, 3).map((item) => allSearchItems.find((entry) => entry.type === "任务" && entry.title === item.title)),
      ...glossary.slice(0, 3).map((item) => allSearchItems.find((entry) => entry.type === "术语" && entry.title === item[1])),
    ].filter(Boolean).filter(searchTypeMatches);
  }
  const terms = q.split(/\s+/).filter(Boolean);
  const compactQuery = q.replace(/\s+/g, "");
  return allSearchItems
    .map((item) => {
      let score = 0;
      const title = item.title.toLowerCase();
      const compactTitle = title.replace(/\s+/g, "");
      const compactKeywords = item.keywords.replace(/\s+/g, "");
      if (title === q) score += 100;
      if (title.includes(q)) score += 60;
      if (compactTitle.includes(compactQuery)) score += 55;
      if (item.keywords.includes(q)) score += 30;
      if (compactKeywords.includes(compactQuery)) score += 24;
      for (const term of terms) if (item.keywords.includes(term)) score += 8;
      return { item, score };
    })
    .filter((entry) => entry.score > 0)
    .filter((entry) => searchTypeMatches(entry.item))
    .sort((a, b) => b.score - a.score)
    .slice(0, 14)
    .map((entry) => entry.item);
}

function renderSearchResults() {
  state.searchItems = searchMatches(globalSearch.value);
  if (!state.searchItems.length) {
    globalResults.innerHTML = `<div class="empty-state">${icon("search")}<h3>没有找到匹配内容</h3><p>试试“生存分析”“缺失值”“量表信度”或直接输入函数名。</p></div>`;
    return;
  }

function openSearchResult(index) {
  const item = state.searchItems[index];
  if (!item) return;

  if (item.errorId) {

}

}

async function copyText(text, successMessage = "已复制") {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  showToast(successMessage);
}

document.addEventListener("submit", (event) => {
  const quickErrorForm = event.target.closest("[data-quick-error-form]");
  if (quickErrorForm) {
    event.preventDefault();
    analyzeQuickError(new FormData(quickErrorForm).get("error")?.toString() || "");
    return;
  }
  const bmiForm = event.target.closest("[data-bmi-demo-form]");
  if (bmiForm) {
    event.preventDefault();
    const formData = new FormData(bmiForm);
    const weight = Number(formData.get("weight"));
    const height = Number(formData.get("height"));
    const result = document.getElementById("bmi-result");
    if (result) {
      if (!(weight > 0 && height > 0)) {
        result.textContent = "请输入有效的体重和身高。";
      } else {
        const bmi = weight / height ** 2;
        const group = bmi < 18.5 ? "偏低" : bmi < 24 ? "正常范围（中国成人常用分组）" : bmi < 28 ? "超重" : "肥胖";
        result.textContent = `BMI = ${bmi.toFixed(1)}，示例分组：${group}。这只是编程演示，不构成医学诊断。`;
      }
    }
    return;
  }
  const demoForm = event.target.closest("[data-control-demo-form]");
  if (demoForm) {
    event.preventDefault();
    const age = Number(new FormData(demoForm).get("age"));
    const result = document.getElementById("control-result");
    if (result) {
      result.textContent = Number.isFinite(age) && age >= 0 && age <= 120
        ? (age >= 18 ? "年龄 ≥ 18：条件为 TRUE，进入 if 分支。" : "年龄 < 18：条件为 FALSE，进入 else 分支。")
        : "请输入 0 到 120 之间的年龄。";
    }
    return;
  }
  const form = event.target.closest("[data-search-form]");
  if (!form) return;
  event.preventDefault();
  const query = new FormData(form).get("query")?.toString().trim() || "";
  if (!query) {
    openSearch();
    return;
  }
  openSearch(query);
});

});

globalSearch.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown") {
    event.preventDefault();
    state.searchIndex = Math.min(state.searchIndex + 1, state.searchItems.length - 1);
    updateSearchSelection();
  }
  if (event.key === "ArrowUp") {
    event.preventDefault();
    state.searchIndex = Math.max(state.searchIndex - 1, 0);
    updateSearchSelection();
  }
  if (event.key === "Enter") {
    event.preventDefault();
    openSearchResult(state.searchIndex);
  }
});

document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    openSearch();
    return;
  }
  if (event.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
    event.preventDefault();
    openSearch();
  }
  if (event.key === "Escape" && document.body.classList.contains("nav-open")) closeMobileNav();
});

window.addEventListener("hashchange", renderRoute);
initTheme();
updateFavoriteCount();
updateContentCounts();
renderRoute();

if (false) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

</script>
</body>
</html>
